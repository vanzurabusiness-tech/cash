    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        :root {
            --bg-color: #f9fafb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --biedronka-red: #e21b22;
            --biedronka-yellow: #fcd116;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Social Proof Banner */
        .top-banner {
            width: 100%;
            background-color: var(--biedronka-yellow);
            color: var(--text-main);
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo */
        .logo {
            max-height: 60px;
            margin-bottom: 30px;
        }

        /* Typography */
        h1 {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        
        .subtitle {
            color: var(--text-muted);
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* Steps list */
        .steps-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .step-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .step-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--biedronka-red);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(226, 27, 34, 0.3);
        }

        .step-text {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Main CTA Button */
        .cta-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: var(--biedronka-red);
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 22px;
            border-radius: 40px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(226, 27, 34, 0.4);
            transition: all 0.2s ease;
            margin-bottom: 16px;
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-align: center;
        }
        
        .cta-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 15px rgba(226, 27, 34, 0.3);
        }

        .disclaimer {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 50px;
            line-height: 1.5;
            padding: 0 10px;
        }

        /* FAQ Section */
        .faq-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 24px;
            text-align: center;
        }

        .faq-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }

        details {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
        }

        summary {
            padding: 20px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::after {
            content: "+";
            font-size: 24px;
            font-weight: 400;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        details[open] summary::after {
            transform: rotate(45deg);
        }

        .faq-content {
            padding: 0 20px 20px 20px;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }

        /* LEGAL FOOTER */
        .legal-footer {
            width: 100%;
            padding: 20px;
            background-color: #f3f4f6;
            color: #9ca3af;
            font-size: 10px;
